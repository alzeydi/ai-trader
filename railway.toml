# Railway deployment configuration
# Docs: https://docs.railway.com/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Runs the Streamlit dashboard (web-facing) AND the trading loop together.
# Railway routes external HTTPS traffic to $PORT; the dashboard is accessible
# in the browser. The trading loop runs as a background process in the same
# container so both share the SQLite DB at /app/data/trades.db.
startCommand = "bash /app/scripts/start.sh"

# Streamlit's health endpoint – Railway uses this to decide the service is up.
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 300

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[deploy.environmentVariables]
# Sensible defaults that Railway can override via the Variables panel.
# Secrets (API keys) are exposed as empty placeholders so they appear in the
# Railway UI – fill in the real values in the dashboard, never commit them.
PYTHONPATH = "/app"
PYTHONDONTWRITEBYTECODE = "1"
PYTHONUNBUFFERED = "1"
LOG_LEVEL = "INFO"
LOOP_INTERVAL_SEC = "60"

# ----- Binance -----
BINANCE_API_KEY = ""
BINANCE_API_SECRET = ""
BINANCE_TESTNET = "true"

# ----- Anthropic / Claude -----
ANTHROPIC_API_KEY = ""
CLAUDE_MODEL = "claude-opus-4-7"
CLAUDE_MAX_TOKENS = "2048"

# ----- Telegram -----
TELEGRAM_BOT_TOKEN = ""
TELEGRAM_CHAT_ID = ""
TELEGRAM_ENABLED = "false"

# ----- Trading core -----
TRADING_MODE = "paper"
PAPER_TRADING = "true"
DRY_RUN = "true"
BASE_CURRENCY = "USDT"
EQUITY_USD = "1000.0"
LEVERAGE = "3"
MARGIN_MODE = "ISOLATED"

# ----- Risk -----
RISK_PER_TRADE_PCT = "0.5"
MAX_OPEN_POSITIONS = "3"
MAX_DAILY_LOSS_PCT = "3.0"
MAX_DRAWDOWN_PCT = "15.0"
ATR_STOP_MULTIPLIER = "1.5"
ATR_TAKE_MULTIPLIER = "3.0"

# ----- Safety mode -----
SAFETY_MAX_CONSECUTIVE_LOSSES = "3"
SAFETY_PAUSE_HOURS = "12"

# ----- Signal engine -----
TIMEFRAME_TREND = "4h"
TIMEFRAME_STRUCTURE = "1h"
TIMEFRAME_EXECUTION = "15m"
SIGNAL_MIN_CONFIDENCE = "0.6"

# ----- Persistence -----
DB_PATH = "data/trades.db"
EQUITY_CSV = "data/equity_curve.csv"
DECISIONS_CSV = "data/ai_decisions.csv"
