# Trading universe for the agent.
# `enabled: false` keeps a symbol loaded for context (e.g. BTC reference) but
# excludes it from signal generation.

symbols:
  - symbol: BTC/USDT:USDT
    enabled: true
    min_notional_usdt: 10
    tick_precision: 1
    quantity_precision: 3
    # BTC also serves as the BTC.D / regime reference (see
    # src/data/context.py:BTC_REFERENCE) — that path is hardcoded and
    # independent of any yaml flag, so it's safe to trade BTC here too.

