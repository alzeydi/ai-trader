[tool.poetry]
name = "ai-trader"
version = "0.1.0"
description = "AI-augmented trading agent for Binance USDT-M Futures (3-layer signal pipeline + Claude veto)"
authors = ["alzeydi <noreply@example.com>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
ccxt = "^4.4.0"
anthropic = "^0.39.0"
pandas = "^2.2.0"
pandas-ta = "^0.4.67b0"
numpy = "^2.2.6"
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
python-dotenv = "^1.0.1"
jinja2 = "^3.1.4"
streamlit = "^1.36.0"
python-telegram-bot = "^21.4"
sqlalchemy = "^2.0.30"
pyyaml = "^6.0.1"
httpx = "^0.27.0"
tenacity = "^8.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-mock = "^3.14.0"
ruff = "^0.5.0"
mypy = "^1.10.0"
types-pyyaml = "^6.0.12"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
ai-trader = "src.main:main"
ai-trader-backtest = "src.backtest:main"

# ----- Tooling -----
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
